<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leistungsorientiertes Taschengeld</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- TOP NAVIGATION -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md">
                    <i data-lucide="coins" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 leading-tight">Familie Taschengeld</h1>
                    <p class="text-xs text-slate-500 font-medium">Performance-System</p>
                </div>
            </div>

            <div id="nav-user-info" class="hidden items-center space-x-4">
                <div class="flex items-center space-x-2 bg-slate-100 py-1.5 px-3 rounded-full border border-slate-200">
                    <span id="current-user-avatar" class="text-xl"></span>
                    <span id="current-user-name" class="text-sm font-semibold text-slate-700"></span>
                    <span id="current-user-role-badge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700"></span>
                </div>
                <button type="button" onclick="logout()" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-slate-100 rounded-lg transition" title="Abmelden">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- LOGIN CONTAINER -->
    <div id="login-container" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 max-w-md w-full space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex bg-indigo-50 p-3 rounded-2xl text-indigo-600 mb-2">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Anmelden</h2>
                <p class="text-sm text-slate-500">Wähle deinen Account und gib dein Passwort ein.</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Benutzer</label>
                    <!-- Fallback-Optionen direkt im HTML verankert -->
                    <select id="login-user-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="eltern">👨‍👩‍👧 Eltern (Eltern)</option>
                        <option value="leon">👦 Leon (Kind)</option>
                        <option value="laura">👧 Laura (Kind)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Passwort</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 transition duration-150 flex items-center justify-center space-x-2">
                    <span>Anmelden</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main id="app-container" class="hidden flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
            <h2 class="text-xl font-bold text-slate-800">Erfolgreich angemeldet!</h2>
            <p class="text-slate-500 text-sm mt-1">Das Dashboard ist einsatzbereit.</p>
        </div>
    </main>

    <script>
        const DEFAULT_USERS = [
            { id: 'eltern', name: 'Eltern', role: 'parent', avatar: '👨‍👩‍👧', password: 'eltern123' },
            { id: 'leon', name: 'Leon', role: 'child', avatar: '👦', password: 'leon123' },
            { id: 'laura', name: 'Laura', role: 'child', avatar: '👧', password: 'laura123' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            initUsers();
        });

        function initUsers() {
            try {
                let users = JSON.parse(localStorage.getItem('pm_users'));
                if (!users || !Array.isArray(users) || users.length === 0) {
                    users = DEFAULT_USERS;
                    localStorage.setItem('pm_users', JSON.stringify(DEFAULT_USERS));
                }
                const select = document.getElementById('login-user-select');
                if (select) {
                    select.innerHTML = users.map(u => 
                        `<option value="${u.id}">${u.avatar} ${u.name} (${u.role === 'parent' ? 'Eltern' : 'Kind'})</option>`
                    ).join('');
                }
            } catch (e) {
                console.error("Speicherfehler:", e);
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const userId = document.getElementById('login-user-select').value;
            const password = document.getElementById('login-password').value;

            let users = DEFAULT_USERS;
            try {
                const stored = JSON.parse(localStorage.getItem('pm_users'));
                if (stored && stored.length > 0) users = stored;
            } catch(e) {}

            const user = users.find(u => u.id === userId);
            if (user && user.password === password) {
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                document.getElementById('nav-user-info').classList.remove('hidden');
                document.getElementById('nav-user-info').classList.add('flex');
                document.getElementById('current-user-avatar').textContent = user.avatar;
                document.getElementById('current-user-name').textContent = user.name;
                document.getElementById('current-user-role-badge').textContent = user.role.toUpperCase();
            } else {
                alert('Falsches Passwort! (Tipp: eltern123, leon123 oder laura123)');
            }
        }

        function logout() {
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('nav-user-info').classList.add('hidden');
            document.getElementById('login-container').classList.remove('hidden');
            document.getElementById('login-password').value = '';
        }
    </script>
</body>
</html>
